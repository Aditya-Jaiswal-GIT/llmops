
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmops-api
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./tracking:/app/tracking
      - ./mlartifacts:/app/mlartifacts
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmops-dashboard
    command: >
      python -m streamlit run dashboard/app.py
      --server.address 0.0.0.0
      --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: "http://api:8000/api/v1"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
